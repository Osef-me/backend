<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>prism.am — stats</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1c1c1c;
      color: #e4e4e4;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    .page {
      position: relative;
      z-index: 2;
      max-width: 1100px;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 3rem;
    }
    .logo {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #e4e4e4;
      text-decoration: none;
      opacity: 0.6;
    }
    .logo:hover { opacity: 1; }
    .nav-updated { font-size: 0.72rem; color: #666; }

    h1.title {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      letter-spacing: 0.05em;
      color: #fff;
      text-shadow: 0 0 12px #ff1a1a, 0 0 36px #ff0000;
      margin-bottom: 0.4rem;
    }
    .subtitle { font-size: 0.85rem; color: #777; margin-bottom: 2.8rem; }

    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 1rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid #2a2a2a;
    }
    .section { margin-bottom: 2.8rem; }

    /* totals */
    .totals {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.8rem;
    }
    .total-card {
      background: #222;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      padding: 1rem 1.1rem;
    }
    .total-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
      margin-bottom: 0.4rem;
    }
    .total-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
    }
    .total-value.red {
      color: #ff6b6b;
      text-shadow: 0 0 8px rgba(255,60,60,0.35);
    }

    /* generic grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 0.8rem;
    }

    .card {
      background: #222;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      padding: 1rem 1.1rem;
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.7rem;
    }
    .card-title {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #bbb;
    }
    .card-badge {
      font-size: 0.68rem;
      color: #888;
    }

    /* map ref */
    .map-ref {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    .map-cover {
      width: 52px; height: 52px;
      border-radius: 6px;
      background: #111 center / cover no-repeat;
      flex-shrink: 0;
      border: 1px solid #333;
    }
    .map-text { min-width: 0; }
    .map-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .map-sub {
      font-size: 0.7rem;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .map-diff {
      font-size: 0.7rem;
      color: #ff8080;
      margin-top: 0.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .map-value {
      margin-left: auto;
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    /* bar chart (statuses / bpm histogram) */
    .bars-v {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .bar-row {
      display: grid;
      grid-template-columns: 90px 1fr 70px;
      align-items: center;
      gap: 0.5rem;
    }
    .bar-label {
      font-size: 0.72rem;
      color: #aaa;
      text-transform: capitalize;
    }
    .bar-track {
      height: 10px;
      background: #111;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, rgba(255,40,40,0.55), rgba(255,120,120,0.85));
      border-radius: 3px;
    }
    .bar-count {
      font-size: 0.72rem;
      color: #888;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* rating type table */
    .rt-head, .rt-row {
      display: grid;
      grid-template-columns: 100px 70px 70px 70px 1fr;
      gap: 0.6rem;
      padding: 0.5rem 0.2rem;
      align-items: center;
      font-size: 0.75rem;
    }
    .rt-head {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #666;
      border-bottom: 1px solid #2a2a2a;
    }
    .rt-row + .rt-row { border-top: 1px solid #222; }
    .rt-type { color: #ff9090; font-weight: 600; }
    .rt-num  { color: #bbb; font-variant-numeric: tabular-nums; }
    .rt-top  { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #888; font-size: 0.7rem; }
    .rt-top a { color: #fff; text-decoration: none; }
    .rt-top a:hover { text-decoration: underline; }

    .list-simple .item {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      border-top: 1px solid #2a2a2a;
      font-size: 0.78rem;
    }
    .list-simple .item:first-child { border-top: 0; }
    .list-simple .item span:first-child {
      color: #ddd;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 0.6rem;
    }
    .list-simple .item span:last-child {
      color: #888;
      font-variant-numeric: tabular-nums;
    }

    a.ext {
      color: inherit;
      text-decoration: none;
    }
    a.ext:hover .map-title { color: #ff9090; }

    .loading {
      color: #555;
      padding: 2rem;
      text-align: center;
      font-size: 0.85rem;
    }

    /* server load */
    .load-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.8rem;
    }
    .load-card {
      background: #1f1f1f;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 0.8rem 1rem;
    }
    .load-label {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 0.3rem;
    }
    .load-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }
    .load-value.dim { color: #aaa; font-weight: 600; }
    .load-sub {
      font-size: 0.65rem;
      color: #666;
      margin-top: 0.15rem;
    }

    /* svg chart */
    .chart {
      width: 100%;
      height: 160px;
      display: block;
    }
    .chart rect {
      fill: rgba(255,60,60,0.55);
      transition: fill 0.15s;
    }
    .chart rect:hover {
      fill: rgba(255,120,120,0.9);
    }
    .chart .axis {
      stroke: #333;
      stroke-width: 1;
    }
    .chart .tick {
      fill: #666;
      font-size: 9px;
      font-family: system-ui, sans-serif;
    }
    .chart .bar-label {
      fill: #aaa;
      font-size: 9px;
      text-anchor: middle;
    }
    .chart .bar-count {
      fill: #fff;
      font-size: 10px;
      font-weight: 600;
      text-anchor: middle;
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>

  <div class="page">
    <nav class="nav">
      <a href="/" class="logo">PRISM</a>
      <span class="nav-updated" id="updated"></span>
    </nav>

    <h1 class="title">Stats</h1>
    <div class="subtitle">aggregate view of the osu!mania corpus</div>

    <div class="section">
      <div class="section-label">Server load</div>
      <div id="load" class="load-grid"></div>
    </div>

    <div id="root" class="loading">loading…</div>
  </div>

  <script>
    /* ── particle mesh (same as status) ─────────────── */
    const canvas = document.getElementById('bg');
    const ctx    = canvas.getContext('2d');
    let W = window.innerWidth, H = window.innerHeight;
    canvas.width = W; canvas.height = H;
    window.addEventListener('resize', () => {
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W; canvas.height = H;
    });
    const PARTICLE_COUNT=60, CONNECT_DIST=160, SPEED=0.35, CELL=160;
    const particles = Array.from({length:PARTICLE_COUNT},()=>({
      x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-0.5)*SPEED, vy:(Math.random()-0.5)*SPEED
    }));
    function buildGrid(){
      const cols=Math.ceil(W/CELL), rows=Math.ceil(H/CELL);
      const grid=new Array(cols*rows).fill(null).map(()=>[]);
      for(const p of particles){
        const cx=Math.min(Math.floor(p.x/CELL),cols-1);
        const cy=Math.min(Math.floor(p.y/CELL),rows-1);
        grid[cy*cols+cx].push(p);
      }
      return {grid,cols,rows};
    }
    function tickBg(){
      ctx.clearRect(0,0,W,H);
      for(const p of particles){
        p.x+=p.vx; p.y+=p.vy;
        if(p.x<0){p.x=0;p.vx*=-1;} if(p.x>W){p.x=W;p.vx*=-1;}
        if(p.y<0){p.y=0;p.vy*=-1;} if(p.y>H){p.y=H;p.vy*=-1;}
      }
      const {grid,cols,rows}=buildGrid();
      const seen=new Set();
      for(let cy=0;cy<rows;cy++) for(let cx=0;cx<cols;cx++){
        const cell=grid[cy*cols+cx];
        for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
          const nx=cx+dx, ny=cy+dy;
          if(nx<0||ny<0||nx>=cols||ny>=rows) continue;
          const nc=grid[ny*cols+nx];
          for(const a of cell) for(const b of nc){
            if(a===b) continue;
            const ia=particles.indexOf(a), ib=particles.indexOf(b);
            const key = ia<ib ? `${ia}-${ib}` : `${ib}-${ia}`;
            if(seen.has(key)) continue;
            seen.add(key);
            const d=Math.hypot(a.x-b.x,a.y-b.y);
            if(d>CONNECT_DIST) continue;
            const t=1-d/CONNECT_DIST;
            ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
            ctx.strokeStyle=`rgba(255,40,40,${t*0.35})`;
            ctx.lineWidth=t*1.2; ctx.stroke();
          }
        }
      }
      for(const p of particles){
        ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2);
        ctx.fillStyle='rgba(255,80,80,0.55)'; ctx.fill();
      }
      requestAnimationFrame(tickBg);
    }
    tickBg();

    /* ── helpers ── */
    const fmtInt = n => n == null ? '—' : Number(n).toLocaleString('en-US');
    const fmtFloat = (n, d=2) => n == null ? '—' : Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
    const fmtTime = s => {
      if (s == null) return '—';
      s = Math.round(s);
      const m = Math.floor(s/60), sec = s%60;
      return `${m}:${String(sec).padStart(2,'0')}`;
    };
    const fmtUptime = s => {
      if (s == null) return '—';
      const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60);
      if (d) return `${d}d ${h}h`;
      if (h) return `${h}h ${m}m`;
      return `${m}m ${s%60}s`;
    };
    const fmtMB = b => b == null ? '—' : `${(b/1024/1024).toFixed(1)} MB`;
    const SKILL_LABEL = {
      stream:'Stream', jumpstream:'Jumpstream', handstream:'Handstream',
      stamina:'Stamina', jackspeed:'Jackspeed', chordjack:'Chordjack', technical:'Technical'
    };
    const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    function mapLink(m) {
      if (!m) return '';
      return m.osuId
        ? `https://osu.ppy.sh/beatmaps/${m.osuId}`
        : '#';
    }
    function mapCard(m, value, valueFmt = fmtFloat) {
      if (!m) return `<div class="map-ref"><div class="map-text"><div class="map-sub">no data</div></div></div>`;
      const cover = m.coverUrl ? `style="background-image:url('${esc(m.coverUrl)}')"` : '';
      const href = mapLink(m);
      return `
        <a class="ext" href="${href}" target="_blank" rel="noopener">
          <div class="map-ref">
            <div class="map-cover" ${cover}></div>
            <div class="map-text">
              <div class="map-title">${esc(m.artist)} — ${esc(m.title)}</div>
              <div class="map-sub">by ${esc(m.creator)}</div>
              <div class="map-diff">[${esc(m.difficulty)}]</div>
            </div>
            ${value != null ? `<div class="map-value">${valueFmt(value)}</div>` : ''}
          </div>
        </a>
      `;
    }

    function bars(items, keyFn, labelFn, countFn) {
      const total = items.reduce((a,b)=>a+countFn(b),0) || 1;
      return `<div class="bars-v">` + items.map(it => {
        const c = countFn(it);
        const pct = (c/total)*100;
        return `
          <div class="bar-row">
            <div class="bar-label">${labelFn(it)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct.toFixed(1)}%"></div></div>
            <div class="bar-count">${fmtInt(c)}</div>
          </div>
        `;
      }).join('') + `</div>`;
    }

    /**
     * Vertical SVG bar chart.
     * items: [{ label, count }]
     * opts:  { width, height, showCount }
     */
    function svgChart(items, opts = {}) {
      const W = opts.width  ?? 520;
      const H = opts.height ?? 160;
      const pad = { t: 12, r: 10, b: 26, l: 32 };
      const plotW = W - pad.l - pad.r;
      const plotH = H - pad.t - pad.b;

      if (!items.length) return `<svg class="chart" viewBox="0 0 ${W} ${H}"></svg>`;

      const max = Math.max(...items.map(it => it.count));
      const barW = plotW / items.length;
      const gap = Math.max(2, barW * 0.15);

      // y ticks: 4 steps
      const ticks = Array.from({length:4}, (_, i) => Math.round((max/3)*(i+0)));
      const yScale = v => plotH - (v / (max || 1)) * plotH;

      const gridLines = ticks.map(t => {
        const y = pad.t + yScale(t);
        return `<line class="axis" x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" opacity="0.3"/>
                <text class="tick" x="${pad.l-4}" y="${y+3}" text-anchor="end">${fmtInt(t)}</text>`;
      }).join('');

      const bars = items.map((it, i) => {
        const h = (it.count / (max || 1)) * plotH;
        const x = pad.l + i*barW + gap/2;
        const y = pad.t + plotH - h;
        const cx = x + (barW - gap)/2;
        const label = String(it.label);
        const countLbl = opts.showCount === false
          ? ''
          : `<text class="bar-count" x="${cx}" y="${y-4}">${fmtInt(it.count)}</text>`;
        return `
          <g>
            <rect x="${x}" y="${y}" width="${barW-gap}" height="${h}" rx="2">
              <title>${esc(label)}: ${fmtInt(it.count)}</title>
            </rect>
            ${countLbl}
            <text class="bar-label" x="${cx}" y="${H-8}">${esc(label)}</text>
          </g>
        `;
      }).join('');

      return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        ${gridLines}
        <line class="axis" x1="${pad.l}" y1="${pad.t+plotH}" x2="${W-pad.r}" y2="${pad.t+plotH}"/>
        ${bars}
      </svg>`;
    }

    /* ── render ── */
    async function load() {
      const res = await fetch('/api/stats');
      const d = await res.json();
      const root = document.getElementById('root');

      const totalsHtml = `
        <div class="totals">
          <div class="total-card"><div class="total-label">Beatmapsets</div><div class="total-value red">${fmtInt(d.totals.beatmapsets)}</div></div>
          <div class="total-card"><div class="total-label">Beatmaps</div><div class="total-value red">${fmtInt(d.totals.beatmaps)}</div></div>
          <div class="total-card"><div class="total-label">Ratings</div><div class="total-value">${fmtInt(d.totals.ratings)}</div></div>
          <div class="total-card"><div class="total-label">Mania Skills</div><div class="total-value">${fmtInt(d.totals.skills)}</div></div>
          <div class="total-card"><div class="total-label">Duplicates</div><div class="total-value">${fmtInt(d.totals.duplicates)}</div></div>
        </div>
      `;

      const keysHtml = `<div class="card">
        <div class="card-head"><div class="card-title">By Key count</div><div class="card-badge">mania (cs)</div></div>
        ${svgChart(d.keyModes.map(x => ({ label: `${x.keys}K`, count: x.count })))}
      </div>`;

      const statusHtml = `<div class="card">
        <div class="card-head"><div class="card-title">By Status</div></div>
        ${svgChart(d.statuses.map(x => ({ label: x.status, count: x.count })))}
      </div>`;

      const bpmHtml = `<div class="card">
        <div class="card-head">
          <div class="card-title">BPM</div>
          <div class="card-badge">min ${fmtFloat(d.bpm.min,0)} · avg ${fmtFloat(d.bpm.avg)} · med ${fmtFloat(d.bpm.median,0)} · max ${fmtFloat(d.bpm.max,0)}</div>
        </div>
        ${svgChart(d.bpm.histogram.map(x => ({ label: x.bucket, count: x.count })))}
      </div>`;

      const lenHtml = `<div class="card">
        <div class="card-head"><div class="card-title">Length</div></div>
        <div class="list-simple">
          <div class="item"><span>Avg drain</span><span>${fmtTime(d.length.avgDrain)}</span></div>
          <div class="item"><span>Max drain</span><span>${fmtTime(d.length.maxDrain)}</span></div>
          <div class="item"><span>Avg total</span><span>${fmtTime(d.length.avgTotal)}</span></div>
          <div class="item"><span>Max total</span><span>${fmtTime(d.length.maxTotal)}</span></div>
        </div>
      </div>`;

      const skillHtml = `
        <div class="section">
          <div class="section-label">Top beatmap per skill</div>
          <div class="grid">
            ${d.skillTop.map(s => `
              <div class="card">
                <div class="card-head">
                  <div class="card-title">${SKILL_LABEL[s.skill] ?? s.skill}</div>
                  <div class="card-badge">highest value</div>
                </div>
                ${mapCard(s.top, s.top?.value, v => fmtFloat(v,2))}
              </div>
            `).join('')}
          </div>
        </div>
      `;

      const rtRowsHtml = d.ratingTypes.map(rt => `
        <div class="rt-row">
          <div class="rt-type">${esc(rt.type)}</div>
          <div class="rt-num">${fmtFloat(rt.min)}</div>
          <div class="rt-num">${fmtFloat(rt.avg)}</div>
          <div class="rt-num">${fmtFloat(rt.max)}</div>
          <div class="rt-top">${
            rt.top
              ? `<a href="${mapLink(rt.top)}" target="_blank" rel="noopener">${esc(rt.top.artist)} — ${esc(rt.top.title)} [${esc(rt.top.difficulty)}]</a> <span style="color:#ff8080">(${fmtFloat(rt.top.rating)})</span>`
              : '—'
          }</div>
        </div>
      `).join('');

      const rtHtml = `
        <div class="section">
          <div class="section-label">Rating types</div>
          <div class="card">
            <div class="rt-head">
              <div>Type</div><div>Min</div><div>Avg</div><div>Max</div><div>Top map</div>
            </div>
            ${rtRowsHtml}
          </div>
        </div>
      `;

      const extremesHtml = `
        <div class="section">
          <div class="section-label">Records</div>
          <div class="grid">
            <div class="card">
              <div class="card-head"><div class="card-title">Fastest BPM</div></div>
              ${mapCard(d.extremes.fastest_bpm, d.extremes.fastest_bpm?.value, v => fmtFloat(v,0))}
            </div>
            <div class="card">
              <div class="card-head"><div class="card-title">Longest drain</div></div>
              ${mapCard(d.extremes.longest_drain, d.extremes.longest_drain?.value, fmtTime)}
            </div>
            <div class="card">
              <div class="card-head"><div class="card-title">Most notes</div></div>
              ${mapCard(d.extremes.most_notes, d.extremes.most_notes?.value, v => fmtInt(v))}
            </div>
            <div class="card">
              <div class="card-head"><div class="card-title">Max combo</div></div>
              ${mapCard(d.extremes.max_combo, d.extremes.max_combo?.value, v => fmtInt(v))}
            </div>
          </div>
        </div>
      `;

      const listsHtml = `
        <div class="section">
          <div class="section-label">Contributors</div>
          <div class="grid">
            <div class="card">
              <div class="card-head"><div class="card-title">Top creators</div><div class="card-badge">by beatmaps</div></div>
              <div class="list-simple">
                ${d.topCreators.map(c => `<div class="item"><span>${esc(c.creator)}</span><span>${fmtInt(c.count)}</span></div>`).join('')}
              </div>
            </div>
            <div class="card">
              <div class="card-head"><div class="card-title">Top artists</div><div class="card-badge">by beatmapsets</div></div>
              <div class="list-simple">
                ${d.topArtists.map(a => `<div class="item"><span>${esc(a.artist)}</span><span>${fmtInt(a.count)}</span></div>`).join('')}
              </div>
            </div>
            <div class="card">
              <div class="card-head"><div class="card-title">Newest ranked</div><div class="card-badge">recent status changes</div></div>
              <div class="list-simple">
                ${d.newestRanked.map(s => `
                  <div class="item">
                    <span><a class="ext" style="color:#ddd" target="_blank" href="${s.osuId ? `https://osu.ppy.sh/beatmapsets/${s.osuId}` : '#'}">${esc(s.artist)} — ${esc(s.title)}</a></span>
                    <span>${s.rankedAt ? s.rankedAt.slice(0,10) : ''}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;

      root.classList.remove('loading');
      root.innerHTML = `
        <div class="section">
          <div class="section-label">Totals</div>
          ${totalsHtml}
        </div>
        <div class="section">
          <div class="section-label">Distribution</div>
          <div class="grid">
            ${keysHtml}
            ${statusHtml}
            ${bpmHtml}
            ${lenHtml}
          </div>
        </div>
        ${extremesHtml}
        ${rtHtml}
        ${skillHtml}
        ${listsHtml}
      `;

      document.getElementById('updated').textContent =
        'Generated ' + new Date(d.generatedAt).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
    }

    load().catch(e => {
      document.getElementById('root').textContent = 'failed to load: ' + (e?.message ?? e);
    });

    /* ── server load poller ── */
    async function loadServer() {
      try {
        const res = await fetch('/api/server-load');
        const s = await res.json();
        const el = document.getElementById('load');
        el.innerHTML = `
          <div class="load-card">
            <div class="load-label">Uptime</div>
            <div class="load-value">${fmtUptime(s.uptimeSec)}</div>
          </div>
          <div class="load-card">
            <div class="load-label">Requests served</div>
            <div class="load-value">${fmtInt(s.requests)}</div>
          </div>
          <div class="load-card">
            <div class="load-label">Resident memory</div>
            <div class="load-value">${fmtMB(s.memory.rssBytes)}</div>
            <div class="load-sub">heap ${fmtMB(s.memory.heapUsedBytes)} / ${fmtMB(s.memory.heapTotalBytes)}</div>
          </div>
          <div class="load-card">
            <div class="load-label">DB connections</div>
            <div class="load-value">${fmtInt(s.db.total)}</div>
            <div class="load-sub">${fmtInt(s.db.active)} active · ${fmtInt(s.db.idle)} idle</div>
          </div>
        `;
      } catch (e) {
        document.getElementById('load').innerHTML =
          `<div class="load-card"><div class="load-label">Server load</div><div class="load-value dim">offline</div></div>`;
      }
    }
    loadServer();
    setInterval(loadServer, 3000);
  </script>
</body>
</html>
