services:
  postgres:
    build:
      context: .
      dockerfile: build/postgres/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: build/deno/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 3000
      NODE_ENV: production
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    restart: unless-stopped

  processor:
    build:
      context: .
      dockerfile: build/rust/Dockerfile
    environment:
      API_URL: http://api:3000
      PROCESSOR_ADDR: 0.0.0.0:4000
    depends_on:
      - api
    ports:
      - "4000:4000"
    restart: unless-stopped

volumes:
  pgdata:
