services:
  postgres:
    build:
      context: .
      dockerfile: build/postgres/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: build/deno/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 3000
      NODE_ENV: production
      PROCESSOR_URL: http://processor:4000
    depends_on:
      - postgres
      - processor
    ports:
      - "3000:3000"
    volumes:
      - rox_data:/data/rox:ro
    restart: unless-stopped

  processor:
    build:
      context: .
      dockerfile: build/rust/Dockerfile
    environment:
      PROCESSOR_ADDR: 0.0.0.0:4000
      ROX_PATH: /data/rox
    depends_on:
      - api
    volumes:
      - rox_data:/data/rox
    restart: unless-stopped

volumes:
  pgdata:
  rox_data:
